# busbar-plane-streaming — THE STREAMING PLANE, as an identity over the duplex/session dialects.
#
# WHAT THIS CRATE IS. One implementation of the plugin contract's plane kind for busbar's STREAMING
# surface: long-lived, bidirectional, per-turn-governed sessions. Its dialects are the duplex/live
# ones — `openai-realtime` and `gemini-live` (the live realtime VOICE dialect is one of them, not the
# plane's name), the `twilio-media-streams` telephony grammar, and the one-shot transcribe/tts
# operations. Voice is ONE dialect inside this plane; the plane is streaming.
#
# WHY IT DELEGATES. Every byte of every dialect this plane speaks is already read and written by the
# duplex codecs in its own `codec` module, which this crate adapts onto the
# contract plane trait itself. No wire format is written twice: this crate is the ONE streaming
# plane (its own registry key, its own capability key) over those codecs. `busbar-plane-voice` was
# the second adapter over the same codecs and is DELETED into this one (#18/#83 — one crate per
# plane, and the plane is streaming).
#
# WHAT THIS CRATE IS NOT. There is no governance here, no breaker, no hook seat and no metering
# arithmetic — those are units, on the far side of the kernel from a plane. The metering method returns
# LOCATORS (where the per-turn quantities are), never a price. The routing method returns a plan, never
# a connection. Nothing here opens a socket, reads a file or reads a clock other than the one the
# context hands it: the plane's entire transitive closure is `busbar-contract` + the codecs it
# already carries as its own module (no async, no `hyper`/`tokio`/`net`).
[package]
name = "busbar-plane-streaming"
version = "1.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The streaming plane for busbar: the plugin contract's plane and session-plane kinds for duplex/live sessions (openai-realtime, gemini-live, twilio, one-shot), with the live realtime voice dialect as one dialect among them — implemented as a thin adapter over its own folded-in duplex codecs."
# THE ROOT CELLS' ADDRESS: `build.rs` states `cells=<this crate>/tests/root/mod.rs` under this
# `links` name, and the composition root's `build.rs` reads it as `DEP_BUSBAR_DOOR_CELLS_<CRATE>_CELLS`
# (the same for a path dependency and a pinned one), so the root compiles this plane's own root cells
# without naming this crate or resolving its checkout. Links no native library.
links = "busbar-door-cells-busbar-plane-streaming"

[lints]
workspace = true

[lib]
name = "busbar_plane_streaming"
path = "src/lib.rs"

# NO FEATURES, ON PURPOSE. A plane compiled two ways is two planes, and the kernel would have no way to
# tell which one it registered. The contract crate holds itself to the same rule and asserts it.

[dependencies]
# THE CONTRACT. The one busbar crate a plugin manifest may name without argument.
busbar-contract = { workspace = true }
# THE CODECS. Read-only from `plane.rs`/`session.rs`/etc.: this crate calls the plane-4 duplex/session
# IR and both dialect readers/writers and edits none of them. Folded IN as the `codec` module (owner
# ruling R7, 2026-09-27, THE DESIGN section 9/#39: no `busbar-*-codec` crate) rather than named as a separate
# crate — the fold is a pure move, so the codecs' own dependencies (serde/serde_json/bytes) are now
# this crate's own.
serde = { workspace = true }
# The object notation the dialect wire (OpenAI Realtime, Gemini Live, Twilio) is written in. The adapter
# hands values across the seam and never invents a second parser.
serde_json = { workspace = true }
# THE MEDIA-FRAME CARRIER. `IrAudioFrame::media` and the tool IR's opaque payloads are `bytes::Bytes`;
# this crate reads and builds them at the same seam rather than converting through an owned `Vec<u8>`.
bytes = { workspace = true }
# THE DOOR'S ONE READING OF THE PUBLIC BASE URL (`door::absolute`): the audience and the metadata URL
# replace the path of the deployment's public URL and drop its query and fragment, parsed once.
url = { workspace = true }
# THE GATHERED MINT ANSWER IS WIPED (`request_unit::RequestUnit::far`): the far end's answer carries
# the live `ek_` secret until the SDK captures it.
zeroize = { workspace = true }
# The one log line an unreadable usage report raises (`busbar_contract::diag_warn!`): the door's
# call capture carries it to the plugin's host log, compiled in or dropped in.
tracing = { workspace = true }

[dev-dependencies]
# The TEST-ONLY seal (#65). `busbar_contract::plugin::TestKernelSeal` is the one blessed
# fixture implementor of the SEALED `KernelSeal` trait; this crate's test harnesses used to
# forge their own. Dev-only and feature-gated, so it is absent from every release build.
busbar-contract = { workspace = true, features = ["test-seal"] }
# The counting `GlobalAlloc` the alloc gates install (`busbar_test_kit::alloc_counter`):
# dev-only, so the crate root keeps the literal `#![forbid(unsafe_code)]`.
busbar-test-kit = { workspace = true }
# THE DOOR, BOTH WAYS lives in the cdylib twin (`plane-streaming-plugin/tests/both_ways.rs`): the
# loader is that crate's dev-dependency, never this one's, so the logic crate's one busbar edge is
# the contract (the fleet's twin rule, as mcp, a2a and decisions hold it). The voice conformance
# harness that drives the door both ways (`testing/voice-conformance/`, ARCHITECT Q6) is busbar's
# testkit crate.
